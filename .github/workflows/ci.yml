name: ci
on:
  push:
    branches: [main]
  pull_request:

# Every dotnet command names LadybugDb.Client.slnx (or one project) explicitly. With a solution
# file at the root that is what the bare command would pick anyway, but it stops a stray
# .sln/.slnx or a second project file from silently changing what CI builds.
jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # macos-latest is Apple silicon (osx-arm64); it and the arm64 Linux leg are advisory until
    # their first green run, per the plan: a leg turns required only once it has passed.
    continue-on-error: ${{ matrix.advisory }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        advisory: [false]
        include:
          - os: macos-latest
            advisory: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # No native fetch step: the engine binaries come from upstream's LadybugDB.Native package,
      # restored like any other package reference by the test and benchmark projects.
      - name: Restore
        run: dotnet restore LadybugDb.Client.slnx
      - name: Build
        run: dotnet build LadybugDb.Client.slnx --no-restore -c Release
      - name: Pack
        # PackagingTests (LadybugDb.Client.Tests) inspects the built .nupkg
        # contents, so it needs real packages on disk - `dotnet build` alone
        # never produces them (GeneratePackageOnBuild is intentionally not
        # set, so dev builds stay fast).
        run: dotnet pack LadybugDb.Client.slnx --no-build -c Release
      - name: Unit tests
        run: dotnet test LadybugDb.Client.Tests --no-build -c Release

  integration:
    name: integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.advisory }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        advisory: [false]
        include:
          # osx-arm64: Apple silicon runner.
          - os: macos-latest
            advisory: true
          # linux-arm64: GitHub-hosted arm64 runner (free for public repositories).
          - os: ubuntu-24.04-arm
            advisory: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Integration tests
        run: dotnet test LadybugDb.Client.IntegrationTests -c Release

  aot-publish:
    # The evidence behind LadybugDb.Client's IsAotCompatible flag: the sample is compiled
    # ahead-of-time (ILC re-runs the trim/AOT analysis, so an unannotated reflective path fails
    # here even if the Roslyn analyzers let it through) and then executed against the real
    # engine. ubuntu-latest has the clang the ILCompiler toolchain needs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish the AOT sample
        run: dotnet publish samples/LadybugDb.Client.AotSample -c Release -r linux-x64 -o aot-out
      - name: Run the native binary
        run: ./aot-out/LadybugDb.Client.AotSample

  interop-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Regenerate interop
        run: bash scripts/regen-interop.sh
      - name: Fail if generated interop is stale
        run: |
          if ! git diff --exit-code -- LadybugDb.Client/Native/LbugNative.g.cs third-party/lbug.h; then
            echo "::error::Generated interop is out of date. Run scripts/regen-interop.sh and commit."
            exit 1
          fi
