name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Fetch native binaries
        shell: bash
        # Invoke via `bash script.sh` rather than `./script.sh` so this works
        # regardless of whether the checkout preserved the executable bit -
        # git only tracks the mode, and shallow/fresh clones on some
        # filesystems (notably Windows runners) don't reliably surface it.
        # `shell: bash` picks up Git Bash on windows-latest; the script is
        # bash, not ported to PowerShell.
        run: bash scripts/fetch-liblbug.sh
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Pack
        # PackagingTests (LadybugDb.Client.Tests) inspects the built .nupkg
        # contents, so it needs real packages on disk - `dotnet build` alone
        # never produces them (GeneratePackageOnBuild is intentionally not
        # set, so dev builds stay fast).
        run: dotnet pack --no-build -c Release
      - name: Unit tests
        run: dotnet test LadybugDb.Client.Tests --no-build -c Release
