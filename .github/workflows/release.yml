name: release
on:
  push:
    tags:
      # v followed by a SemVer version, e.g. v0.2.0 or v0.2.0-beta.1.
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Package version to publish, e.g. 0.2.0 or 0.2.0-beta.1 (no leading
          'v'). Only used for a manual run; a tag push derives this
          automatically from the tag name and ignores this input.
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    # A GitHub Environment lets the nuget.org Trusted Publishing policy be
    # scoped to this specific workflow run context, and lets the repo owner
    # attach a required-reviewers gate in the environment's own settings
    # (Settings -> Environments -> release) without this workflow needing to
    # know anything about that gate - see docs/RELEASING.md.
    environment: release
    permissions:
      # Required for NuGet/login to obtain a GitHub OIDC token to exchange
      # for a short-lived nuget.org API key. Without this the OIDC request
      # silently fails.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Determine package version
        id: version
        shell: bash
        # The tag (or, for a manual run, the `version` input) is the single
        # source of truth for the published version - it overrides whatever
        # VersionPrefix/VersionSuffix Directory.Build.props currently has via
        # `-p:Version=` on every dotnet invocation below, so there is no risk
        # of accidentally publishing the repo's placeholder pre-release
        # version under a tag that was meant to ship something else.
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
            if [ -z "$VERSION" ]; then
              echo "::error::workflow_dispatch requires a non-empty 'version' input when not triggered by a tag push." >&2
              exit 1
            fi
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::'$VERSION' is not a valid SemVer version (expected e.g. 0.2.0 or 0.2.0-beta.1)." >&2
            exit 1
          fi
          echo "Publishing version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Fetch native binaries
        shell: bash
        run: bash scripts/fetch-liblbug.sh

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release -p:Version=${{ steps.version.outputs.version }}

      - name: Unit tests
        run: dotnet test LadybugDb.Client.Tests --no-build -c Release

      - name: Integration tests
        run: dotnet test LadybugDb.Client.IntegrationTests --no-build -c Release

      - name: Pack
        # Only LadybugDb.Client and LadybugDb.Client.Native are IsPackable;
        # the two test projects are not, so this produces exactly the two
        # packages this workflow pushes below.
        run: dotnet pack --no-build -c Release -p:Version=${{ steps.version.outputs.version }} -o artifacts

      - name: NuGet login (OIDC -> temporary API key)
        # Requested here, immediately before the push steps, because the
        # issued key is only valid for 1 hour and each GitHub OIDC token is
        # single-use - requesting it earlier in the job (e.g. before the
        # build/test steps above) risks it expiring, or a second unrelated
        # login attempt failing, before it's actually used.
        uses: NuGet/login@v1
        id: login
        with:
          # nuget.org profile (username), not email - set by the repo owner
          # as a repository variable. See docs/RELEASING.md for the one-time
          # setup this depends on.
          user: ${{ vars.NUGET_USER }}

      - name: Push LadybugDb.Client
        run: >-
          dotnet nuget push "artifacts/LadybugDb.Client.${{ steps.version.outputs.version }}.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Push LadybugDb.Client.Native
        run: >-
          dotnet nuget push "artifacts/LadybugDb.Client.Native.${{ steps.version.outputs.version }}.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
