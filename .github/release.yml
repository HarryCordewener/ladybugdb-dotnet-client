# Categories for GitHub's generated release notes ("Generate release notes" on the release
# page, or `gh release create vX.Y.Z --generate-notes`). A pull request lands in the first
# category whose label it carries; CONTRIBUTING.md asks for one of these labels on every PR.
# The categories mirror CHANGELOG.md's Keep-a-Changelog headings so the two can be reconciled.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Added
      labels:
        - added
        - enhancement
    - title: Changed
      labels:
        - changed
    - title: Fixed
      labels:
        - fixed
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Dependencies
      labels:
        - dependencies
    - title: Other
      labels:
        - "*"
